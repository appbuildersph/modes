<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SIBOL promo composition</title>
<style>
@font-face { font-family: 'Baloo 2'; src: url(fonts/baloo-2-latin-800-normal.woff2) format('woff2'); font-weight: 800; }
@font-face { font-family: 'Nunito'; src: url(fonts/nunito-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
@font-face { font-family: 'Nunito'; src: url(fonts/nunito-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: 'Atkinson'; src: url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
:root {
  --cream: #fbf1da; --surface: #fffaf0; --yellow: #f7d26a; --mint: #8fd9b6; --green: #245d54;
  --sky: #a9d8f0; --peach: #f4a87c; --ink: #3a2e2a; --outline: #1c1410; --blue: #0066fe; --black: #111; --paper: #fff7cc;
  --out: cubic-bezier(0.22, 1, 0.36, 1); --in: cubic-bezier(0.64, 0, 0.78, 0);
  --W: 1920px; --H: 1080px;
}
html, body { margin: 0; background: #000; width: var(--W); height: var(--H); overflow: hidden; }
body { font-family: 'Nunito', sans-serif; color: var(--ink); }
#stage { position: relative; width: var(--W); height: var(--H); overflow: hidden; }
.scene { position: absolute; inset: 0; opacity: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; }
.scene.on { opacity: 1; }
.scene.fade { transition: opacity 250ms var(--out); }
.scene.fade.off { opacity: 0; transition: opacity 900ms var(--in); }
.field { position: absolute; inset: 0; }
.row { position: relative; display: flex; align-items: center; justify-content: center; gap: 120px; width: 100%; padding: 0 140px; box-sizing: border-box; }
.col { flex: 1 1 0; min-width: 0; }
.col.text { max-width: 820px; }
h1, h2 { font-family: 'Baloo 2', sans-serif; font-weight: 800; margin: 0; line-height: 1.02; letter-spacing: -0.02em; }
.kinetic { font-size: 104px; }
.kinetic .line { display: block; overflow: hidden; padding-bottom: 0.08em; }
.kinetic .w { display: inline-block; transform: translateY(1.15em); opacity: 0; }
.on .kinetic .w { animation: rise 520ms var(--out) forwards; animation-delay: calc(var(--i) * 80ms + var(--d, 0ms)); }
@keyframes rise { to { transform: translateY(0); opacity: 1; } }
.sub { font-size: 44px; font-weight: 700; margin-top: 36px; opacity: 0; transform: translateY(20px); }
.on .sub { animation: up 600ms var(--out) forwards; animation-delay: var(--d, 600ms); }
@keyframes up { to { opacity: 1; transform: none; } }
.small { font-size: 30px; font-weight: 400; margin-top: 24px; opacity: 0; }
.on .small { animation: up 600ms var(--out) forwards; animation-delay: var(--d, 900ms); }
/* phone */
.phone { position: relative; width: 420px; height: 908px; border: 3px solid var(--outline); border-radius: 56px; background: var(--outline); box-shadow: 12px 14px 0 var(--outline); overflow: hidden; flex: 0 0 auto; }
.phone > video, .phone > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; background: #fbf1da; }
.phone > [hidden], .phone > img.seq[hidden] { display: none; }
.phone > img.seq { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.phone.big { width: 480px; height: 1038px; }
.phone.enter { transform: translateY(60px); opacity: 0; }
.on .phone.enter { animation: up 700ms var(--out) forwards; animation-delay: var(--d, 150ms); }
/* captions */
#cap { position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%); max-width: 1560px; padding: 18px 44px; border-radius: 40px; background: var(--outline); color: var(--cream); font-size: 36px; font-weight: 700; line-height: 1.25; text-align: center; opacity: 0; transition: opacity 250ms; white-space: normal; }
#cap.show { opacity: 1; }
#cap.atk { font-family: 'Atkinson', sans-serif; letter-spacing: 0.03em; }
/* pills and chips */
.pill { display: inline-block; padding: 14px 34px; border: 3px solid var(--outline); border-radius: 999px; background: var(--yellow); color: var(--outline); font-family: 'Baloo 2'; font-weight: 800; font-size: 40px; box-shadow: 5px 6px 0 var(--outline); }
.chip { color: var(--outline); display: inline-flex; align-items: center; gap: 18px; padding: 16px 30px; border: 3px solid var(--outline); border-radius: 28px; background: var(--surface); box-shadow: 6px 8px 0 var(--outline); opacity: 0; transform: translateY(24px); }
.on .chip { animation: up 600ms var(--out) forwards; animation-delay: var(--d, 300ms); }
.chip .ic { width: 84px; height: 84px; border-radius: 22px; border: 3px solid var(--outline); display: grid; place-items: center; font-family: 'Baloo 2'; font-weight: 800; font-size: 44px; }
.chip .t1 { font-family: 'Baloo 2'; font-weight: 800; font-size: 56px; line-height: 1; }
.chip .t2 { font-size: 30px; font-weight: 700; opacity: 0.85; }
.desc { font-size: 40px; font-weight: 700; line-height: 1.3; margin-top: 40px; max-width: 760px; opacity: 0; }
.on .desc { animation: up 700ms var(--out) forwards; animation-delay: var(--d, 900ms); }
.use { font-size: 28px; font-weight: 400; line-height: 1.35; margin-top: 22px; max-width: 760px; opacity: 0; }
.on .use { animation: up 700ms var(--out) forwards; animation-delay: var(--d, 1400ms); }
/* wifi scene */
#s-wifi .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1); }
#s-wifi.on .shot { animation: zoom 4s linear forwards; }
@keyframes zoom { to { transform: scale(1.06); } }
#s-wifi .pill { position: absolute; left: 50%; top: 80px; transform: translateX(-50%); opacity: 0; }
#s-wifi.on .pill { animation: up 400ms var(--out) forwards; animation-delay: 1200ms; }
#s-wifi .phonewrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
#s-wifi .phonewrap.on { opacity: 1; }
/* question card */
.qcard { width: 980px; padding: 70px 60px; border: 4px solid var(--outline); border-radius: 36px; background: #fff; box-shadow: 10px 12px 0 var(--outline); text-align: center; font-family: 'Baloo 2'; font-weight: 800; font-size: 120px; color: var(--ink); transform: scale(0.42); opacity: 0; }
.on .qcard { animation: pop 650ms var(--out) forwards; }
@keyframes pop { to { transform: scale(1); opacity: 1; } }
/* proof card */
.card { border: 4px solid var(--outline); border-radius: 32px; overflow: hidden; background: #fff; box-shadow: 12px 14px 0 var(--outline); opacity: 0; transform: translateX(-50px); }
.on .card { animation: inx 700ms var(--out) forwards; animation-delay: var(--d, 100ms); }
@keyframes inx { to { opacity: 1; transform: none; } }
.card img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: left top; }
/* waveform */
.wave { display: flex; gap: 10px; align-items: center; height: 90px; margin-top: 40px; opacity: 0; }
.on .wave { animation: up 500ms var(--out) forwards; animation-delay: 600ms; }
.wave i { width: 14px; height: 20px; border-radius: 8px; background: var(--yellow); animation: bar 900ms ease-in-out infinite; animation-delay: calc(var(--i) * 110ms); }
@keyframes bar { 0%, 100% { height: 18px; } 50% { height: 86px; } }
/* steps */
.steps { display: flex; gap: 22px; margin-top: 44px; opacity: 0; }
.on .steps { animation: up 300ms linear forwards; animation-delay: 500ms; }
.steps b { width: 86px; height: 86px; border: 3px solid var(--outline); border-radius: 24px; display: grid; place-items: center; font-family: 'Baloo 2'; font-size: 44px; background: var(--surface); box-shadow: 5px 6px 0 var(--outline); }
.steps b.on { background: var(--yellow); }
.bar { height: 22px; width: 560px; border: 3px solid var(--outline); border-radius: 999px; background: var(--surface); margin-top: 28px; overflow: hidden; opacity: 0; }
.on .bar { animation: up 300ms linear forwards; animation-delay: 500ms; }
.bar i { display: block; height: 100%; width: 0; background: var(--mint); transition: width 1150ms linear; }
/* three phones */
.trio { display: flex; gap: 70px; align-items: flex-end; }
.trio .phone { width: 330px; height: 714px; border-radius: 46px; }
.trio .phone:nth-child(1) { --d: 100ms; } .trio .phone:nth-child(2) { --d: 180ms; } .trio .phone:nth-child(3) { --d: 260ms; }
.wifi-x { position: absolute; top: 60px; right: 80px; font-size: 44px; font-weight: 700; color: var(--ink); opacity: 0; }
.on .wifi-x { animation: up 500ms var(--out) forwards; animation-delay: 500ms; }
/* end */
#s-end img.og { position: relative; width: 1920px; height: 1008px; object-fit: contain; }
#s-end .foot { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; color: #fff; font-size: 34px; font-weight: 700; opacity: 0; }
#s-end.on .foot { animation: up 700ms var(--out) forwards; animation-delay: 700ms; }
#s-end .foot .tag { display: block; font-size: 26px; font-weight: 400; margin-top: 10px; opacity: 0.9; }
/* vertical layout */
body.vert { --W: 1080px; --H: 1920px; }
.vert .row { flex-direction: column; gap: 60px; padding: 0 70px; }
.vert .col.text { max-width: 940px; text-align: center; }
.vert .kinetic { font-size: 96px; }
.vert .phone { width: 440px; height: 951px; }
.vert .phone > [hidden] { display: none; }
.phone > img.seq { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.phone.big { width: 440px; height: 951px; }
.vert .trio { gap: 24px; }
.vert .trio .phone { width: 300px; height: 649px; }
.vert .qcard { width: 900px; font-size: 100px; }
.vert .desc, .vert .use { margin-left: auto; margin-right: auto; }
.vert #cap { max-width: 980px; white-space: normal; font-size: 34px; bottom: 90px; }
.vert #s-end img.og { width: 1080px; height: 567px; }
.vert #s-wifi .shot { object-fit: cover; }
.vert .card { width: 940px; height: 520px; }
</style>
</head>
<body>
<div id="stage">
  <section class="scene" id="s-wifi">
    <img class="shot" src="img/wifi-off-screen.png" alt="">
    <div class="phonewrap" data-at="2.4"><div class="field" style="background:var(--outline)"></div><div class="phone"><img src="img/wifi-off-app.png" alt=""></div></div>
    <span class="pill" data-t="wifi"></span>
  </section>

  <section class="scene fade" id="s-problem">
    <div class="field" style="background:var(--cream)"></div>
    <div class="row"><div class="col text"><h1 class="kinetic" data-k="problem"></h1></div></div>
  </section>

  <section class="scene" id="s-splash">
    <div class="field" style="background:var(--yellow)"></div>
    <div class="row">
      <div class="col text"><h1 class="kinetic" data-k="splash"></h1></div>
      <div class="phone enter"><video muted playsinline data-clip="splash"></video><img data-fallback="splash" src="img/classroom-standard.png" alt="" hidden></div>
    </div>
  </section>

  <section class="scene" id="s-local">
    <div class="field" style="background:var(--blue)"></div>
    <div class="row">
      <div class="col text" style="color:#fff">
        <h1 class="kinetic" data-k="local" style="font-size:92px"></h1>
        <div class="card" style="width:820px;height:420px;margin-top:44px"><img src="img/edge-inference-proof.png" alt=""></div>
      </div>
      <div class="phone enter"><video muted playsinline data-clip="local"></video><img data-fallback="local" src="img/classroom-standard.png" alt="" hidden></div>
    </div>
  </section>

  <section class="scene" id="s-question">
    <div class="field" style="background:var(--cream)"></div>
    <div class="row">
      <div class="col text"><h1 class="kinetic" data-k="question"></h1></div>
      <div class="qcard" data-q></div>
    </div>
  </section>

  <section class="scene fade" id="s-kalma">
    <div class="field" style="background:var(--green)"></div>
    <div class="row">
      <div class="col text" style="color:var(--cream)">
        <div class="chip"><span class="ic" style="background:var(--mint)">K</span><span><span class="t1" data-m="kalma.label"></span><br><span class="t2" data-m="kalma.gloss"></span></span></div>
        <p class="desc" data-m="kalma.description"></p>
        <p class="use" data-m="kalma.useCase"></p>
      </div>
      <div class="phone"><video muted playsinline data-clip="kalma"></video><img data-fallback="kalma" src="img/classroom-kalma.png" alt="" hidden></div>
    </div>
  </section>

  <section class="scene" id="s-pakinig">
    <div class="field" style="background:var(--black)"></div>
    <div class="row">
      <div class="col text" style="color:var(--paper);font-family:'Atkinson',sans-serif">
        <div class="chip" style="background:var(--paper)"><span class="ic" style="background:var(--sky)">P</span><span><span class="t1" data-m="pakinig.label"></span><br><span class="t2" data-m="pakinig.gloss"></span></span></div>
        <p class="desc" data-m="pakinig.description" style="font-family:'Atkinson';letter-spacing:0.03em;word-spacing:0.2em"></p>
        <div class="wave"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i><i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i></div>
        <p class="use" data-m="pakinig.useCase"></p>
      </div>
      <div class="phone enter"><video muted playsinline data-clip="pakinig"></video><img data-fallback="pakinig" src="img/classroom-pakinig.png" alt="" hidden></div>
    </div>
  </section>

  <section class="scene" id="s-hakbang">
    <div class="field" style="background:var(--peach)"></div>
    <div class="row">
      <div class="col text">
        <div class="chip"><span class="ic" style="background:var(--peach)">H</span><span><span class="t1" data-m="hakbang.label"></span><br><span class="t2" data-m="hakbang.gloss"></span></span></div>
        <p class="desc" data-m="hakbang.description"></p>
        <div class="steps"><b data-at="1.2">1</b><b data-at="2.4">2</b><b data-at="3.6">3</b></div>
        <div class="bar"><i></i></div>
        <p class="use" data-m="hakbang.useCase"></p>
      </div>
      <div class="phone enter"><video muted playsinline data-clip="hakbang"></video><img data-fallback="hakbang" src="img/classroom-standard.png" alt="" hidden></div>
    </div>
  </section>

  <section class="scene" id="s-proof">
    <div class="field" style="background:var(--cream)"></div>
    <span class="wifi-x">Wi-Fi ✕</span>
    <div class="row">
      <div class="col text"><h1 class="kinetic" data-k="proof" style="font-size:84px"></h1></div>
      <div class="trio">
        <div class="phone enter"><img src="clips/frames/09/00510.jpg" alt=""></div>
        <div class="phone enter"><img src="clips/frames/09/00690.jpg" alt=""></div>
        <div class="phone enter"><img src="clips/frames/09/00870.jpg" alt=""></div>
      </div>
    </div>
  </section>

  <section class="scene fade" id="s-end">
    <div class="field" style="background:var(--blue)"></div>
    <img class="og" src="img/og.png" alt="">
    <div class="foot"><span data-t="end"></span><span class="tag">#AppBuildersPH &nbsp;·&nbsp; Local AI &nbsp;·&nbsp; github.com/appbuildersph/modes</span></div>
  </section>

  <div id="cap"></div>
</div>

<script>
const qs = new URLSearchParams(location.search)
const LANG = qs.get('lang') === 'tl' ? 'tl' : 'en'
const VERT = qs.get('v') === '1'
if (VERT) document.body.classList.add('vert')
const MODES = {
  kalma: { label: { en: 'Kalma', tl: 'Kalma' }, gloss: { en: 'Calm / Focus', tl: 'Kalmado / Nakatutok' },
    description: { en: 'A calm, quiet screen and short replies. One idea at a time.', tl: 'Tahimik at payak na screen, maikling sagot. Isang ideya bawat sagot.' },
    useCase: { en: 'Designed to support learners who find busy screens or lots of text overwhelming.', tl: 'Idinisenyo para suportahan ang mga mag-aaral na nahihirapan sa magulong screen o maraming teksto.' } },
  pakinig: { label: { en: 'Pakinig', tl: 'Pakinig' }, gloss: { en: 'Listen', tl: 'Makinig' },
    description: { en: 'Big text, read aloud word by word. Numbers said as words.', tl: 'Malaking teksto, binabasa nang malakas bawat salita. Binibigkas ang mga numero.' },
    useCase: { en: 'Designed to support learners who find reading hard, and learners still building reading skills.', tl: 'Idinisenyo para suportahan ang mga mag-aaral na nahihirapang magbasa, at ang mga nag-aaral pa lang magbasa.' } },
  hakbang: { label: { en: 'Hakbang', tl: 'Hakbang' }, gloss: { en: 'Step by Step', tl: 'Isang hakbang' },
    description: { en: 'A bigger step-by-step card, then a quick check.', tl: 'Mas malaking card ng bawat hakbang, tapos may maikling tanong.' },
    useCase: { en: 'Designed to support learners who do better with small steps and concrete examples.', tl: 'Idinisenyo para suportahan ang mga mag-aaral na mas natututo sa maliliit na hakbang at konkretong halimbawa.' } },
}
const Q = { en: 'What is 12 + 15?', tl: 'Ano ang 12 + 15?' }

let script, clips = {}
async function load() {
  script = await (await fetch('script.json')).json()
  try { clips = await (await fetch('clips.json')).json() } catch {}
  for (const b of script.beats) {
    const k = document.querySelector(`[data-k="${b.id}"]`)
    if (k) {
      const lines = b[LANG === 'tl' ? 'titleTl' : 'titleEn']
      let i = 0
      k.innerHTML = lines.map((l) => `<span class="line">${l.split(' ').map((w) => `<span class="w" style="--i:${i++}">${w}</span>`).join(' ')}</span>`).join('')
    }
    const t = document.querySelector(`[data-t="${b.id}"]`)
    if (t) t.textContent = b[LANG === 'tl' ? 'titleTl' : 'titleEn'][0]
  }
  for (const el of document.querySelectorAll('[data-m]')) {
    const [m, f] = el.dataset.m.split('.')
    el.textContent = MODES[m][f][LANG]
  }
  document.querySelector('[data-q]').textContent = Q[LANG]
  // clips: { sceneKey: { file, offset } }
  const loads = []
  // Clips are pre-extracted frame sequences (headless Chromium does not paint seeked video frames).
  for (const v of document.querySelectorAll('video[data-clip]')) {
    const c = clips[v.dataset.clip]
    const fb = v.parentElement.querySelector('img[data-fallback]')
    if (!c || !c.frames) { v.remove(); fb.hidden = false; continue }
    const mk = (dir, offset, extra) => { const i = document.createElement('img'); i.className = 'seq'; i.dataset.dir = dir; i.dataset.offset = offset || 0; i.dataset.fps = c.fps || 30; i.dataset.count = c.count || 0; Object.assign(i.dataset, extra || {}); i.hidden = true; return i }
    const A = mk(c.frames, c.offset, { seq: 'a', clip: v.dataset.clip })
    v.replaceWith(A)
    if (c.framesB) A.after(mk(c.framesB, c.offsetB, { seq: 'b', switch: c.switch || 0, count: c.countB || 0 }))
  }
  await Promise.all(loads)
  await document.fonts.ready
  await new Promise((r) => setTimeout(r, 300))
  window.__ready = true
}

const cap = document.getElementById('cap')
let t0 = 0, entered = new Set(), done = false
let fakeNow = null
const now = () => fakeNow ?? performance.now()
function tick() {
  const t = (now() - t0) / 1000
  for (const b of script.beats) {
    const s = document.getElementById('s-' + b.id)
    const active = t >= b.start && t < b.end
    if (active && !entered.has(b.id)) {
      entered.add(b.id); s.classList.add('on')
      const bar = s.querySelector('.bar i'); if (bar) setTimeout(() => { bar.style.width = '100%' }, 500)
      const text = b[LANG]
      cap.textContent = text; cap.classList.toggle('show', !!text); cap.classList.toggle('atk', b.id === 'pakinig')
      if (b.id === 'end') cap.classList.remove('show')
    }
    if (entered.has(b.id) && !active && s.classList.contains('on')) {
      s.classList.remove('on'); s.classList.add('off')
    }
    if (active) for (const el of s.querySelectorAll('[data-at]')) if (t - b.start >= Number(el.dataset.at)) el.classList.add('on')
    if (active) {
      const va = s.querySelector('img.seq[data-seq="a"]'), vb = s.querySelector('img.seq[data-seq="b"]')
      if (va) va.hidden = false
      if (vb) { const sw = t - b.start >= Number(vb.dataset.switch); vb.hidden = !sw; va.hidden = sw }
    }
  }
  const last = script.beats[script.beats.length - 1]
  if (t >= last.end) { done = true; window.__done = true; return }
  if (fakeNow == null) requestAnimationFrame(tick)
}
// Deterministic driver for the frame renderer: fake clock, every CSS animation and transition
// is paused and scrubbed to the fake time at which it started, videos are seeked by hand.
window.__frame = async (t) => {
  fakeNow = t * 1000
  if (t === 0) t0 = 0
  tick()
  for (const a of document.getAnimations()) {
    if (a.__start == null) { a.__start = fakeNow; a.pause() }
    a.currentTime = Math.max(0, fakeNow - a.__start)
  }
  await window.__seekVideos(t)
}
window.__play = () => { t0 = performance.now(); requestAnimationFrame(tick) }
// Frame renderer: videos do not follow Chrome virtual time, so seek them by hand each frame.
window.__seekVideos = async (t) => {
  const waits = []
  for (const b of script.beats) {
    if (t < b.start || t >= b.end) continue
    for (const i of document.querySelectorAll(`#s-${b.id} img.seq`)) {
      if (i.hidden) continue
      const fps = Number(i.dataset.fps)
      let f = Math.floor((Number(i.dataset.offset) + (t - b.start)) * fps) + 1
      if (Number(i.dataset.count) > 0) f = Math.min(f, Number(i.dataset.count))
      const src = `${i.dataset.dir}/${String(f).padStart(5, '0')}.jpg`
      if (i.getAttribute('src') === src) continue
      i.src = src
      waits.push(i.decode().catch(() => {}))
    }
  }
  await Promise.all(waits)
}
load()
if (qs.get('auto') === '1') { const w = setInterval(() => { if (window.__ready) { clearInterval(w); window.__play() } }, 50) }
</script>
</body>
</html>
