<svg xmlns="http://www.w3.org/2000/svg" width="720" height="356" viewBox="0 0 720 356" role="img" aria-label="Decode speed in tokens per second against reply length, one dot per reply" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Decode speed in tokens per second against reply length, one dot per reply</title>
