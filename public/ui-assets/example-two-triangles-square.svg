  <g transform="translate(105 10) rotate(45 105 105)">
    <path d="M18 18H192V192Z" fill="#F7D26A" stroke="#3A2E2A" stroke-width="10" stroke-linejoin="round"/>
    <path d="M18 18V192H192Z" fill="#F4A87C" stroke="#3A2E2A" stroke-width="10" stroke-linejoin="round"/>
    <path d="M18 18 192 192" fill="none" stroke="#FFF8F6" stroke-width="6" stroke-dasharray="12 10"/>
  </g>
</svg>
